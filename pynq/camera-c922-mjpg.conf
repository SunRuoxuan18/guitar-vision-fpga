[Service]
# Use the stable YUYV path validated on 2026-10-26. MJPG passthrough can
# produce malformed EOI frames and then wedge the PYNQ UVC host controller.
ExecStart=
ExecStart=/usr/bin/python3 -u -B /home/xilinx/vision_server.py --camera 0 --camera-format YUYV --jpeg-encoder native-fast --host 0.0.0.0 --port 8082 --max-width 640 --max-height 480 --fps 15 --jpeg-quality 70
