[Service]
# C922 exposes an MJPEG stream. Keep those camera-encoded JPEG frames for
# preview instead of converting YUYV and recompressing every frame on the PS.
ExecStart=
ExecStart=/usr/bin/python3 -u -B /home/xilinx/vision_server.py --camera 0 --camera-format MJPG --jpeg-encoder native-fast --host 0.0.0.0 --port 8082 --max-width 640 --max-height 480 --fps 30 --jpeg-quality 70
